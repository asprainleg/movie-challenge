name: Daily Box Office Update

on:
  # Runs every day at 11:54 AM Central Time (16:54 UTC during CDT / 17:54 UTC during CST)
  # Off-the-hour to avoid GitHub Actions queue congestion at :00
  # Running weekends too captures opening-day and Saturday box office before Monday's confirmed totals
  schedule:
    - cron: "54 10 * * *"

  # Adds a "Run workflow" button in the GitHub Actions tab for manual triggers
  workflow_dispatch:

# Required so the pipeline can commit data.json back to the repo
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Check out the repo ──────────────────────────────────
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Set up Python ───────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 3. Install dependencies ────────────────────────────────
      - name: Install dependencies
        run: pip install requests beautifulsoup4

      # ── 4. Run the scraper ─────────────────────────────────────
      - name: Scrape BOM + Metacritic, update data.json
        run: python scripts/update_data.py

      # ── 5. Commit updated data.json back to the repo ───────────
      # The dashboard's GitHub Pages site will auto-refresh with the new data.
      - name: Commit updated data.json
        run: |
          git config user.name  "Movie Challenge Bot"
          git config user.email "bot@github-actions.com"
          git add data.json
          # Only commit if data.json actually changed
          git diff --staged --quiet \
            && echo "No changes to data.json — skipping commit" \
            || git commit -m "chore: daily update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
